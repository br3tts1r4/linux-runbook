# copy and paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# vim-style cursor motion: alt+h/l left/right, shift widens to a word

# by character: bare arrow keys
map alt+h send_text all \x1b[D
map alt+l send_text all \x1b[C

# by word: ctrl+arrow, which readline/zsh/nvim read as word motion
map alt+shift+h send_text all \x1b[1;5D
map alt+shift+l send_text all \x1b[1;5C